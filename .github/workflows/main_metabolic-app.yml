# Build and deploy metabolic.vitalckm.com to Azure Web App for Containers (same pattern as cardio-app).
# Nothing is built or deployed unless the full CI suite passes.
#
# One-time setup (see README "Deployment"):
#   repository variable  DEPLOY_ENABLED = true            (until then this workflow only runs the tests)
#   repository variables ACR_LOGIN_SERVER                 e.g. cardiovitalckmacr-fyg7axdjd5d0aud4.azurecr.io
#                        AZURE_WEBAPP_NAME                e.g. metabolic-app
#   repository secrets   ACR_USERNAME, ACR_PASSWORD       (registry admin user, or a token with push rights)
#                        AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (OIDC federated credential)

name: Build and deploy container app to Azure Web App - metabolic-app

on:
  push:
    branches:
      - main
    # Documentation, research code and Markdown do not change the running app, so they do not redeploy it.
    paths-ignore:
      - "docs/**"
      - "ml/**"
      - "data/research/**"
      - "data/external/**"
      - "**.md"
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/metabolic-app:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    needs: build
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for the OIDC login
      contents: read
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: Production
          images: ${{ vars.ACR_LOGIN_SERVER }}/metabolic-app:${{ github.sha }}

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            v=$(curl -fsS "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health" | python3 -c "import sys,json;print(json.load(sys.stdin)['model_version'])" 2>/dev/null) && { echo "healthy: $v"; exit 0; }
            sleep 10
          done
          echo "health check did not pass within 5 minutes" && exit 1
