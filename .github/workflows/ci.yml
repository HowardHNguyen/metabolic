name: CI

# Pull requests run this directly; the deploy workflow calls it (workflow_call) and only builds/deploys if it passes.
on:
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m compileall -q backend/app
      - name: Unit + API tests
        run: pytest -q
        working-directory: backend

  backend-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Auth, history, email verification and password reset tests (real Postgres)
        run: pytest -q tests/test_db_integration.py tests/test_email_integration.py
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Browser model matches the trained model (golden values)
        run: node --test tests/*.test.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push) and smoke-test it
        run: |
          docker build -t metabolic-app:ci .
          docker run -d --name metabolic -p 8000:8000 metabolic-app:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep '"status":"ok"'
          curl -sf -X POST "localhost:8000/predict?save=false" -H 'content-type: application/json' \
            -d '{"SEX":1,"AGE":52,"RACE":"Black","BMI":31,"WAIST":106,"TG":168,"HDL":38}' | grep '"verdict":"meets"'
          curl -sf localhost:8000/ | grep -q "<div id=\"root\">"
          curl -sf "localhost:8000/verify?token=smoke" | grep -q "<div id=\"root\">"
          curl -sf "localhost:8000/reset?token=smoke" | grep -q "<div id=\"root\">"
          docker rm -f metabolic
